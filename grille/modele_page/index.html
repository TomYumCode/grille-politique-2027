<link rel="stylesheet" href="style.css">
<script>
// Écran d'ouverture : seulement au lancement, pas quand on arrive par une notification
// (#emission=…) ni avec le réglage « Réduire les animations ». L'animation (ouverture.json,
// lue par lottie_light.min.js) se charge tout de suite ; en attendant, son image fixe
// (ouverture.svg) est déjà affichée.
if (/#emission=/.test(location.hash) || matchMedia("(prefers-reduced-motion: reduce)").matches) {
  document.documentElement.classList.add("sans-ouverture");
} else {
  window.animationOuverture = fetch("ouverture.json").then((r) => r.json()).catch(() => null);
  const lecteur = document.createElement("script");
  lecteur.src = "lottie_light.min.js";
  lecteur.async = true;
  document.head.append(lecteur);
}
</script>

<body>
<div id="ouverture" class="ouverture" aria-hidden="true" style="background-color:#1d3a5f">
  <img src="ouverture.svg" alt="">
  <div class="ouverture-anim"></div>
</div>
<header class="entete">
  <div class="titre-ligne">
    <h1>Grille politique 2027</h1>
    <button id="bouton-filtres" class="bouton-filtres" aria-expanded="false" aria-controls="filtres">Filtres</button>
  </div>
  <div class="perimetre" role="group" aria-label="Émissions affichées">
    <button type="button" data-perimetre="campagne">Présidentielle 2027</button>
    <button type="button" data-perimetre="tout">Toute la politique</button>
    <button type="button" data-perimetre="favoris" aria-label="Mes favoris">★ Favoris</button>
  </div>
  <p id="fraicheur" class="fraicheur"></p>
  <nav id="jours" class="jours" aria-label="Jours"></nav>
  <p id="filtre-chaine" class="filtre-chaine" hidden></p>
  <section id="filtres" class="filtres" hidden>
    <div class="groupe" id="filtre-categories"><span class="etiquette">Catégorie</span></div>
    <div class="groupe" id="filtre-plateformes"><span class="etiquette">Plateforme</span></div>
    <div class="groupe">
      <label class="etiquette" for="filtre-candidat">Candidat</label>
      <select id="filtre-candidat"><option value="">Tous</option></select>
    </div>
    <button id="tout-afficher" class="lien-discret">Tout réafficher</button>
    <div class="groupe">
      <span class="etiquette">Favoris (☆ sur une émission pour en ajouter)</span>
      <button id="favori-presidentielle" class="puce favori" type="button"></button>
      <span id="liste-favoris" class="groupe"></span>
    </div>
    <div class="groupe" id="zone-notifications" hidden>
      <span class="etiquette">Notifications des favoris</span>
      <button id="bouton-notifications" class="puce" type="button"></button>
      <span id="etat-notifications" class="aide"></span>
    </div>
  </section>
</header>
<main id="grille" class="grille"></main>
<footer class="pied"><a href="sources.html">Sources et confidentialité</a></footer>
