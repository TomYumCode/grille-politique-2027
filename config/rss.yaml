  # Actualité de la télévision
  - {nom: "stephanelarue.com", adresse: "https://stephanelarue.com/feed/"}
  - {nom: "Programme TV", adresse: "https://www.programme-tv.net/rss/news.xml"}
  - {nom: "Télé Star", adresse: "https://www.telestar.fr/feed"}
