# Émissions à invités (« L'Invité de 7h50 », « Le grand entretien », « Face à face »…) :
# retenues quand le titre ou le résumé donne à l'invité une fonction politique
# (« Edouard Geffray, ministre de l'Education nationale »), même s'il n'est dans aucune liste.
fonctions_politiques:
  - "ministre"
  - "ministres"
  - "secrétaire d'État"
  - "député"
  - "députée"
  - "députés"
  - "eurodéputé"
  - "eurodéputée"
  - "sénateur"
  - "sénatrice"
  - "maire"
  - "porte-parole"
  - "secrétaire national"
  - "secrétaire nationale"
  - "premier secrétaire"
  - "première secrétaire"
  - "président de région"
  - "présidente de région"
  - "président du groupe"
  - "présidente du groupe"
  - "candidat"
  - "candidate"

# Bouton « Présidentielle 2027 » de la page : émissions consacrées à la campagne, parmi
# toutes les émissions politiques retenues. Une émission y entre si un candidat (ou un membre
# d'équipe de campagne, « campagne: true ») y est présent, si c'est un meeting, si elle vient
# de la chaîne d'un parti ou d'un candidat, ou si son titre (pas son résumé) contient l'un de
# ces mots. Recalculé à chaque collecte : un invité annoncé la veille la fait entrer.
presidentielle:
  mots:
    - "présidentielle"
    - "présidentielles"
    - "présidentiable"
    - "présidentiables"
    - "élection présidentielle"
    - "campagne"
    - "candidat"
    - "candidate"
    - "candidats"
    - "candidates"
    - "candidature"
    - "primaire"
    - "primaires"
    - "sondage"
    - "sondages"
    - "premier tour"
    - "second tour"
    - "entre-deux-tours"
    - "parrainages"
    - "réunion publique"
    - "2027 raisons de voter"

# Filtre 1 : liste blanche.
liste_blanche:
  # Toute émission de ces chaînes est retenue (nom exact dans chaines.yaml).
  # LCP / Public Sénat (télévision) n'y est plus : trop de documentaires.
  # Ses émissions politiques passent par les mots-clés et la liste des émissions.
  chaines:
    - "LCP-Assemblée nationale"
    # Matinales quotidiennes largement politiques (YouTube, directs seulement).
    - "Tocsin"
    - "Ligne Droite"
  # Toute émission d'une chaîne de ces catégories est retenue.
  categories_de_chaine:
    - "Parti"
    - "Débats parlementaires"
    - "Personnalité politique"
    - "Interviews politiques"
  # Émissions toujours politiques. Le titre du guide doit commencer par ce texte
  # (majuscules, accents, tirets et ponctuation ignorés : « Franc-jeu » = « Franc jeu »).
  # Forme {titre: "…", chaine: "…"} pour limiter l'émission à une chaîne.
  # Pour voir le titre exact d'une émission : python3 -m grille chercher-tv "mot"
  emissions:
    - "Questions au gouvernement"
    - "Questions politiques"
    - "Dimanche en politique"
    - "Les Quatre Vérités"
    - "Le Grand Jury"
    - "Franc-jeu"
    # Titre trop courant pour toutes les chaînes : limité à la chaîne indiquée.
    - {titre: "Face à face", chaine: "BFMTV"}
    # Radios privées (titres des grilles des sites).
    - {titre: "La Grande interview", chaine: "Europe 1"}
    - {titre: "La semaine politique", chaine: "Europe 1"}
    - {titre: "L'interview politique", chaine: "Europe 1"}
    - {titre: "L'invité RTL", chaine: "RTL"}
    - {titre: "Face à Fogiel", chaine: "RTL"}
    - {titre: "L'invité politique", chaine: "Sud Radio"}
    # Interview de 8 h 30, diffusée aussi sur BFMTV (les deux se fusionnent à l'affichage).
    - {titre: "Face à face", chaine: "RMC"}
    # Rendez-vous politiques vus seulement en « cas douteux » jusqu'au 21 octobre 2026
    # (le guide ne nomme pas l'invité). Le début du titre suffit (« 100% Politique Week-End »).
    - {titre: "BFM Politique", chaine: "BFMTV"}
    - {titre: "Le grand oral 2027", chaine: "BFMTV"}
    - {titre: "100% Politique", chaine: "CNews"}
    - {titre: "L'invité politique", chaine: "franceinfo"}
    - {titre: "C politique", chaine: "France 5"}
    - {titre: "Parlement hebdo", chaine: "LCP / Public Sénat"}
    # LCP le lundi soir (titre du guide : « LCP-Lundi c'est politique »), aussi sur Twitch.
    - "Lundi c'est politique"
    - {titre: "LCP-Lundi c'est politique", chaine: "LCP / Public Sénat"}
    # Radio Nova, saison 2026-2027 (vidéos YouTube dont le titre commence ainsi).
    - {titre: "2027 raisons de voter", chaine: "Radio Nova"}

# Filtre 2 : mots-clés. Les noms de candidats, de personnalités et de partis
# ci-dessus (sauf les partis « ambigu ») s'ajoutent automatiquement à cette liste.
# Éviter les mots trop larges : « élection » attrape l'élection de Miss France,
# « candidat » les jeux télévisés.
mots_cles:
  - "présidentielle"
  - "présidentielles"
  - "premier tour"
  - "second tour"
  - "entre-deux-tours"
  - "parrainages"
  - "campagne électorale"

# Mots-clés cherchés dans le TITRE seulement : trop courants dans les descriptions
# (« 28 minutes » est décrit comme un magazine de débat chaque soir). Une émission
# de ce genre reste retenue si sa description cite un candidat ou « présidentielle ».
mots_cles_titre:
  - "débat"
  - "meeting"
  - "allocution"

# Télévision : programmes ignorés s'ils commencent entre ces heures (heure de Paris),
# presque toujours des rediffusions nocturnes. « de: 1, a: 6 » masque de 1 h à 5 h 59.
# Supprimer la rubrique pour tout garder.
tv_heures_masquees: {de: 1, a: 6}

# Cas douteux (lot 6, étape 1 : mesure seulement, rien n'est ajouté à la grille).
# Émissions écartées par les deux filtres mais qui pourraient être politiques : elles
# seraient soumises à Claude si le classement par modèle est activé. L'email du matin
# en donne le nombre et quelques exemples. Les partis « ambigu » s'y ajoutent d'office.
cas_douteux:
  # Mots cherchés dans le titre et la description.
  mots:
    - "politique"
    - "politiques"
    - "gouvernement"
    - "ministre"
    - "ministres"
    - "député"
    - "députée"
    - "députés"
    - "sénateur"
    - "sénatrice"
    - "Sénat"
    - "Assemblée nationale"
    - "Élysée"
    - "Matignon"
    - "élection"
    - "élections"
    - "primaire de la gauche"
  # Émissions à invités dont le guide ne nomme souvent pas l'invité (début du titre).
  emissions_a_invites:
    - "C à vous"
    - "C ce soir"
    - "C l'hebdo"
    - "C dans l'air"
    - "Quotidien"
    - "28 minutes"
    - "Le grand enjeu"
    - "L'heure des pros"
    - "Les grandes gueules"
    - "En toute franchise"
    - "24h Pujadas"
    - "BFM Politique"
    - "RTL Matin"
    - "Europe 1 Matin"
    - "Apolline Matin"
    - "Le Grand Matin"
    - "Parlons vrai chez Bourdin"
    - "L'invité"
