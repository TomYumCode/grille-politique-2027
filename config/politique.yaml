# Personnalités non candidates mais à repérer comme invités.
# « campagne: true » : membre d'une équipe de campagne annoncée ; sa présence suffit à
# classer l'émission dans « Présidentielle 2027 » (comme celle d'un candidat).
# « sigle » : affiché après le nom (« Jean-Philippe Tanguy (RN) ») ; pour un membre
# d'équipe de campagne dont le parti n'est pas vérifié, « équipe <candidat> ».
personnalites:
  # Exécutif : ni candidat ni équipe de campagne, mais ses allocutions sont des événements politiques.
  - {nom: "Emmanuel Macron", alias: ["Macron"], sigle: "président de la République"}
