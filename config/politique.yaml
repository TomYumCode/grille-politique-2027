# Filtre 1 : liste blanche.
liste_blanche:
  # Toute émission de ces chaînes est retenue (nom exact dans chaines.yaml).
  # LCP / Public Sénat (télévision) n'y est plus : trop de documentaires.
  # Ses émissions politiques passent par les mots-clés et la liste des émissions.
  chaines:
    - "LCP-Assemblée nationale"
  # Toute émission d'une chaîne de ces catégories est retenue.
  categories_de_chaine:
    - "Parti"
    - "Débats parlementaires"
    - "Personnalité politique"
    - "Interviews politiques"
  # Émissions toujours politiques. Le titre du guide doit commencer par ce texte
  # (majuscules, accents, tirets et ponctuation ignorés : « Franc-jeu » = « Franc jeu »).
  # Forme {titre: "…", chaine: "…"} pour limiter l'émission à une chaîne.
  # Pour voir le titre exact d'une émission : python3 -m grille chercher-tv "mot"
  emissions:
    - "Questions au gouvernement"
    - "Questions politiques"
    - "Dimanche en politique"
    - "Les Quatre Vérités"
    - "Le Grand Jury"
    - "Franc-jeu"
    # Titre trop courant pour toutes les chaînes : limité à la chaîne indiquée.
    - {titre: "Face à face", chaine: "BFMTV"}
    # Radio Nova, saison 2026-2027 (vidéos YouTube dont le titre commence ainsi).
    - {titre: "2027 raisons de voter", chaine: "Radio Nova"}

# Filtre 2 : mots-clés. Les noms de candidats, de personnalités et de partis
# ci-dessus (sauf les partis « ambigu ») s'ajoutent automatiquement à cette liste.
# Éviter les mots trop larges : « élection » attrape l'élection de Miss France,
# « candidat » les jeux télévisés.
mots_cles:
  - "présidentielle"
  - "présidentielles"
  - "premier tour"
  - "second tour"
  - "entre-deux-tours"
  - "parrainages"
  - "campagne électorale"

# Mots-clés cherchés dans le TITRE seulement : trop courants dans les descriptions
# (« 28 minutes » est décrit comme un magazine de débat chaque soir). Une émission
# de ce genre reste retenue si sa description cite un candidat ou « présidentielle ».
mots_cles_titre:
  - "débat"
  - "meeting"

# Télévision : programmes ignorés s'ils commencent entre ces heures (heure de Paris),
# presque toujours des rediffusions nocturnes. « de: 1, a: 6 » masque de 1 h à 5 h 59.
# Supprimer la rubrique pour tout garder.
tv_heures_masquees: {de: 1, a: 6}
