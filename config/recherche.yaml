# Invité cherché sur le web par Claude (grille/invites_web.py) : au début d'une émission
# politique à invité encore inconnu (BFMTV, LCI… ne l'annoncent nulle part ailleurs).
# Clé dans le secret GitHub ANTHROPIC_API_KEY ; sans elle, rien n'est cherché.
#
#   actif               : false pour tout arrêter sans toucher au code
#   modele              : modèle Claude (claude-opus-5-5 ; claude-haiku-5-5, moins cher)
#   recherches_par_jour : plafond de questions par jour (le coût en dépend)
#   avant_debut         : minutes avant le début où la recherche peut commencer
#   apres_debut         : minutes après le début où elle s'arrête
#   heure_annonces      : heure du premier essai pour les émissions à surveiller
#   a_surveiller        : grandes émissions absentes de la grille qui reçoivent parfois un
#                         responsable politique ; elles n'entrent dans la grille que si Claude
#                         trouve un invité de politique.yaml (deux essais par jour : à
#                         heure_annonces, puis juste avant l'émission). Chaîne : nom exact de
#                         chaines.yaml, ou une liste pour une émission diffusée sur plusieurs
#                         chaînes ; heure : début habituel ; duree : minutes (45 par défaut).
actif: true
modele: claude-haiku-5-5
recherches_par_jour: 20
avant_debut: 10
apres_debut: 35
heure_annonces: "17:00"
a_surveiller:
  - {titre: "Le 20h", chaine: "TF1", heure: "20:00", duree: 45}
  - {titre: "Le 20h", chaine: "France 2", heure: "20:00", duree: 45}
  - {titre: "L'heure des pros", chaine: ["CNews", "Europe 1"], heure: "09:00", duree: 90}
  - {titre: "L'heure des pros 2", chaine: "CNews", heure: "20:05", duree: 55}
