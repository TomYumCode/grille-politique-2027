# Chaînes suivies — une ligne par chaîne.
#
# Champs : plateforme (tv, radio, youtube, twitch ou web), nom, adresse, categorie.
# Champ facultatif : a_confirmer: true pour une adresse non vérifiée (contrôlée au lot 3).
#
# Pour ajouter une chaîne depuis GitHub (navigateur ou téléphone) : bouton crayon,
# copier une ligne existante, changer les valeurs, « Commit changes ».
# Une ligne invalide n'empêche pas les autres d'être lues : elle est signalée.
#
# Adresses acceptées :
#   youtube : https://www.youtube.com/@pseudo, /channel/UC…, /user/…, /c/…
#   twitch  : https://www.twitch.tv/identifiant
#   tv      : identifiant XMLTV du guide xmltvfr.fr (ex. France2.fr)
#   radio   : code de station de l'API Radio France (ex. FRANCEINTER), ou adresse de la grille d'une radio
#             privée lue par grille/radios_privees.py (rtl.fr, europe1.fr, sudradio.fr,
#             rmc.bfmtv.com, radioclassique.fr)
#   web     : page d'agenda d'un parti ou d'un candidat (lue seulement si un lecteur existe pour ce site :
#             rassemblementnational.fr, upr.fr ; voir grille/agendas.py)
# Champ facultatif « direct » : page pour regarder en direct, ou liste de pages entre crochets.
# Champ facultatif « logo » : adresse d'une image, à la place du logo fourni par la source.

chaines:

