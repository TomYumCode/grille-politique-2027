<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hors connexion</title>
<style>
  :root { --fond: #ffffff; --texte: #16202c; --discret: #566273; --bleu: #1f3a5f; --rouge: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --fond: #0f141b; --texte: #e8edf3; --discret: #9aa6b5; --bleu: #8fb3e0; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fond); color: var(--texte); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; text-align: center;
    padding: env(safe-area-inset-top) max(24px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(24px, env(safe-area-inset-left)); }
  .bloc { display: grid; gap: 14px; justify-items: center; max-width: 30ch; }
  .logo { width: 72px; height: 72px; border-radius: 16px; background: #1f3a5f; display: grid;
    grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px; box-sizing: border-box; }
  .logo i { background: #fff; border-radius: 3px; position: relative; }
  .logo i:nth-child(5)::after { content: ""; position: absolute; inset: 27.5%; border-radius: 50%; background: #c62828; }
  h1 { font-size: 1.2rem; margin: 0; }
  p { margin: 0; color: var(--discret); }
  button { font: 600 1rem inherit; font-family: inherit; color: #fff; background: #1f3a5f; border: 0; border-radius: 999px; padding: 10px 22px; }
</style>
</head>
<body>
<div class="bloc">
  <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Pas de connexion</h1>
  <p>La grille s'affichera dès que le téléphone sera de nouveau connecté à internet.</p>
  <button type="button" id="reessayer">Réessayer</button>
</div>
<script>
document.getElementById("reessayer").addEventListener("click", () => location.replace("https://tomyumcode.github.io/grille-politique-2027/"));
window.addEventListener("online", () => location.replace("https://tomyumcode.github.io/grille-politique-2027/"));
</script>
</body>
</html>
