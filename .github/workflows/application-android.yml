# Application Android de la grille (dossier application/, Capacitor) : construction d'essai.
# À chaque changement du dossier application/ sur la branche principale, ou à la main (onglet
# Actions → « Application Android » → Run workflow). Le fichier .apk se télécharge en bas de la
# page de l'exécution (« Artifacts ») et s'installe sur un téléphone Android pour l'essayer.
name: Application Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["application/**", ".github/workflows/application-android.yml"]
  pull_request:
    paths: ["application/**", ".github/workflows/application-android.yml"]
permissions:
  contents: read
jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx cap sync android
      - name: Construire l'application d'essai (debug)
        run: ./gradlew assembleDebug
        working-directory: application/android
      - uses: actions/upload-artifact@v5
        with:
          name: grille-politique-android-essai
          path: application/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
