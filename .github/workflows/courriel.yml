# Email du matin à 7 h, heure de Paris.
# GitHub ne connaît que l'heure UTC, et ses déclenchements prennent du retard ou sont abandonnés
# quand il est chargé (aucun le 16 octobre 2026, un seul à 10 h 21 le 17). La tâche a donc une
# occasion de démarrer toutes les 20 minutes de 4 h à 16 h 40 UTC (de 6 h à 18 h à Paris, été
# comme hiver) : elle attend 7 h si besoin, puis envoie, même en retard. Un seul email par jour :
# une fois l'envoi fait, les déclenchements suivants s'arrêtent tout de suite. Juste avant l'envoi, une collecte rafraîchit
# la base, au cas où les collectes de la nuit auraient été sautées.
name: Email du matin

on:
  schedule:
    - cron: "0,20,40 4-16 * * *"  # de 6 h à 18 h 40 (été) ou de 5 h à 17 h 40 (hiver), heure de Paris
  workflow_dispatch:
    inputs:
      forcer:
        description: "Envoyer tout de suite, même si l'email du jour est déjà parti"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  attendre:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      envoyer: ${{ steps.attente.outputs.envoyer }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Récupérer la base (email du jour déjà parti ?)
        run: .github/scripts/base.sh recuperer
      - id: attente
        name: Attendre 7 h (heure de Paris)
        run: |
          if [ "${{ inputs.forcer }}" = "true" ]; then
            echo "envoyer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(python -m grille envoi-du-jour)" = "fait" ]; then
            echo "Email du jour déjà envoyé : rien à faire."
            echo "envoyer=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          attente=$(python -m grille attente-7h)
          if [ "$attente" = "hors-plage" ]; then
            echo "Avant 6 h à Paris (déclenchement de l'autre saison) : rien à faire."
            echo "envoyer=false" >> "$GITHUB_OUTPUT"
          else
            echo "Attente de ${attente} s avant 7 h"
            sleep "$attente"
            echo "envoyer=true" >> "$GITHUB_OUTPUT"
          fi

  envoyer:
    needs: attendre
    if: needs.attendre.outputs.envoyer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: donnees
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Récupérer la base
        run: .github/scripts/base.sh recuperer
      - name: Collecter juste avant l'envoi (données fraîches même si la nuit a été sautée)
        if: ${{ !inputs.forcer }}
        env:
          RADIOFRANCE_API_KEY: ${{ secrets.RADIOFRANCE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ "$(python -m grille envoi-du-jour)" = "fait" ]; then echo "Email déjà parti : pas de collecte."; exit 0; fi
          if [ "$(python -m grille collecte-recente --minutes 30)" = "oui" ]; then echo "Collecte récente."; exit 0; fi
          python -m grille collecter > /dev/null || echo "::warning::Collecte incomplète avant l'email, voir l'état des sources."
      - name: Envoyer l'email
        env:
          SMTP_SERVEUR: ${{ secrets.SMTP_SERVEUR }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_UTILISATEUR: ${{ secrets.SMTP_UTILISATEUR }}
          SMTP_MOT_DE_PASSE: ${{ secrets.SMTP_MOT_DE_PASSE }}
          EMAIL_EXPEDITEUR: ${{ secrets.EMAIL_EXPEDITEUR }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
          ADRESSE_PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m grille courriel ${{ inputs.forcer && '--forcer' || '' }}
      - name: Enregistrer la base (date d'envoi)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/base.sh enregistrer
