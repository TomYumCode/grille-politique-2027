# Service de notifications (Cloudflare Worker), publié par .github/workflows/notifications.yml.
# L'identifiant de l'espace de stockage (KV) est inscrit au moment de la publication :
# il n'est jamais écrit dans le dépôt.
name = "grille-2027-notifications"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
PAGE = "https://tomyumcode.github.io/grille-politique-2027/"

[[kv_namespaces]]
binding = "ETAT"
id = "__ID_KV__"
